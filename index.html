    if ((ps.length && ps.every(p => p.done) && el > 0) || el > 300000) Net.update('rooms/' + this.pin, { status: 'done' });
  },
  // --- 플레이 ---
  play() {
    this.view = 'play'; const room = this.room;
    state.lang = room.lang || state.lang;
    const battle = room.game === 'battle';
    this.paint(`<div class="ol-play">
      <div class="game-hud"><div class="hud-item">핀 <b>${esc(this.pin)}</b></div><div class="hud-item">${battle ? '맞힘' : '진행'} <b class="op-a">0</b></div><div class="hud-item">타수 <b class="op-cpm">0</b></div>${battle ? '<div class="hud-item time-wrap">⏱ <b class="g-time">60</b><div class="tbar"><i class="g-tbar"></i></div></div>' : ''}</div>
      <div class="field ol-field">
        <div class="ol-target typing-text big"></div>
        <div class="sent-next ol-next"></div>
        <div class="overlay"></div>
      </div>
      <form class="type-form game-form"><input class="type-input" type="text" placeholder="시작 신호를 기다려요…" disabled></form>
      <div class="panel ol-tracks-wrap"><div class="ol-tracks"></div></div>
    </div>`);
    const r = this.root;
    this.ov = $('.overlay', r); this.input = $('.type-input', r);
    Object.assign(this, { li: 0, wi: 0, doneKeys: 0, liveKeys: 0, score: 0, finished: false, lastPush: 0, live: false });
    this.ti = new TypeInput(this.input, { spaceSubmit: battle, onInput: v => this.pInput(v), onSubmit: v => this.pSubmit(v) });
    this.paintTarget();
    clearInterval(this.cd);
    this.cd = setInterval(() => this.playClock(), 100);
    this.playClock(); this.playUpdate();
  },
  paintTarget() {
    const room = this.room, r = this.root, battle = room.game === 'battle';
    if (battle) {
      renderTarget($('.ol-target', r), room.words[this.wi % room.words.length], null);
      $('.ol-next', r).innerHTML = room.words.slice(this.wi + 1, this.wi + 5).map(w => `<span class="tag ghost">${esc(w)}</span>`).join(' ');
    } else {
      const l = room.lines[this.li]; if (l == null) return;
      renderTarget($('.ol-target', r), l, null);
      const nx = room.lines[this.li + 1];
      $('.ol-next', r).innerHTML = nx ? `<span class="tag">다음</span> ${esc(nx)}` : '<span class="tag">마지막 문장!</span>';
    }
  },
  playClock() {
    if (this.view !== 'play') return clearInterval(this.cd);
    const room = this.room, left = room.startAt - Net.now();
    if (left > 0) {
      const n = Math.ceil(left / 1000);
      if (this._cdn !== n) { this._cdn = n; this.ov.innerHTML = `<div class="count">${n}</div>`; this.ov.classList.add('show'); Sound.tick(); }
      return;
    }
    if (!this.live && !this.finished) {
      this.live = true; this._cdn = 0; hideOverlay(this.ov); Sound.ok();
      this.input.disabled = false; this.input.placeholder = room.game === 'battle' ? '낱말을 치고 스페이스바!' : '문장을 똑같이 치고 엔터!';
      this.ti.reset(); this.ti.focus();
    }
    const el = (Net.now() - room.startAt) / 1000;
    if (room.game === 'battle') {
      const t = Math.max(0, 60 - el);
      $('.g-time', this.root).textContent = Math.ceil(t); $('.g-tbar', this.root).style.width = (t / 60 * 100) + '%';
      if (t <= 0 && !this.finished) this.finish();
    }
    const keys = this.doneKeys + this.liveKeys;
    this.cpm = el > 1 ? Math.round(keys / el * 60) : 0;
    $('.op-cpm', this.root).textContent = this.cpm;
    if (!this.finished && Net.now() - this.lastPush > 450) this.push();
  },
  push(extra) {
    this.lastPush = Net.now();
    const room = this.room, battle = room.game === 'battle';
    const total = battle ? 1 : room.lines.reduce((s, l) => s + keyCount(l), 0);
    const o = { cpm: this.cpm || 0, score: this.score, p: battle ? 0 : clamp((this.doneKeys + this.liveKeys) / total, 0, 1), ...(extra || {}) };
    Net.update(`rooms/${this.pin}/players/${this.me}`, o).catch(() => { });
    $('.op-a', this.root).textContent = battle ? this.score : Math.round(o.p * 100) + '%';
  },
  pInput(v) {
    if (!this.live || this.finished) return;
    const room = this.room, battle = room.game === 'battle';
    const t = battle ? room.words[this.wi % room.words.length] : room.lines[this.li];
    const c = compare(t, v); renderTarget($('.ol-target', this.root), t, c);
    if (!battle) { let k = 0; for (let i = 0; i < c.st.length; i++) { if (c.st[i] === 'ok') k += keyCount(t[i]); else { if (c.st[i] === 'pending') k += keyCount(v[i]); break; } } this.liveKeys = k; }
  },
  pSubmit(v) {
    if (!this.live || this.finished || !v) return;
    const room = this.room;
    if (room.game === 'battle') {
      const t = room.words[this.wi % room.words.length]; this.ti.reset();
      if (v === t) { this.score++; this.doneKeys += keyCount(t); Sound.pop(); } else { Sound.bad(); shake($('.ol-field', this.root)); }
      this.wi++; this.paintTarget(); this.push(); return;
    }
    const line = room.lines[this.li];
    if (v !== line) { Sound.bad(); shake($('.ol-field', this.root)); toast('🔧 빨간 글자를 고쳐야 넘어가요!', 1300); return; }
    Sound.ok(); this.doneKeys += keyCount(line); this.liveKeys = 0; this.li++; this.ti.reset();
    if (this.li >= room.lines.length) return this.finish();
    this.paintTarget(); this.push();
  },
  finish() {
    this.finished = true; this.input.disabled = true;
    const room = this.room, t = Net.now() - room.startAt;
    const el = t / 1000; this.cpm = Math.round(this.doneKeys / Math.max(el, 1) * 60);
    this.push(room.game === 'battle' ? { done: true, t } : { done: true, t, p: 1 });
    Sound.win();
    showOverlay(this.ov, `<div class="ov-icon">🏁</div><h3>${room.game === 'battle' ? '시간 끝!' : '골인!'}</h3><p class="sub">${room.game === 'battle' ? `${this.score}개 맞힘` : `${el.toFixed(1)}초`} · ${this.cpm}타<br>다른 친구들을 기다리는 중…</p>`);
  },
  playUpdate() { const r = this.root; if (!r) return; const tr = $('.ol-tracks', r); if (tr) tr.innerHTML = olTracks(this.room, this.me, this.room.mode === 'duel' ? 2 : 8); },
  // --- 관전 (선생님 화면) ---
  watch() {
    this.view = 'watch'; const room = this.room;
    this.paint(`<div class="ol-watch">
      <div class="game-hud"><div class="hud-item">핀 <b>${esc(this.pin)}</b></div><div class="hud-item ol-wgame">${room.game === 'battle' ? '⏱️ 60초 낱말 배틀' : '🏎️ 문장 레이스'}</div><div class="hud-item">⏱ <b class="ow-time">-</b></div>${this.isHost ? '<button class="btn small" data-end>지금 끝내기</button>' : ''}</div>
      <div class="panel ol-board"><div class="ol-tracks big"></div></div>
      ${!this.isHost ? '<p class="hint">지금 진행 중인 판이 끝나면 다음 판부터 함께할 수 있어요!</p>' : ''}
    </div>`);
    const e = $('[data-end]', this.root); if (e) e.onclick = () => Net.update('rooms/' + this.pin, { status: 'done' });
    clearInterval(this.wt); this.wt = setInterval(() => {
      if (this.view !== 'watch') return clearInterval(this.wt);
      const el = (Net.now() - this.room.startAt) / 1000, x = $('.ow-time', this.root);
      if (x) x.textContent = el < 0 ? `시작 ${Math.ceil(-el)}초 전` : this.room.game === 'battle' ? `${Math.max(0, Math.ceil(60 - el))}초 남음` : `${el.toFixed(0)}초`;
    }, 250);
    this.watchUpdate();
  },
  watchUpdate() { const tr = $('.ol-tracks', this.root); if (tr) tr.innerHTML = olTracks(this.room, this.me); },
  // --- 결과 ---
  result() {
    this.view = 'result'; clearInterval(this.cd);
    if (this.ti) { this.input.disabled = true; }
    const room = this.room, rk = olRank(room), myI = rk.findIndex(p => p.id === this.me);
    const pod = [1, 0, 2].map(i => rk[i] ? `<div class="pod p${i + 1}"><div class="pod-av">${pxi(rk[i].av, 56, 16)}</div><div class="pod-name">${esc(rk[i].name)}</div><div class="pod-stat">${room.game === 'battle' ? `${rk[i].score || 0}개` : rk[i].done ? `${(rk[i].t / 1000).toFixed(1)}초` : `${Math.round((rk[i].p || 0) * 100)}%`}</div><div class="pod-block">${i + 1}</div></div>` : '<div class="pod empty"></div>').join('');
    Sound.win();
    this.paint(`<div class="ol-result">
      <div class="panel">
        <h3 class="pxt ol-rtitle">${room.mode === 'duel' ? (rk[0] ? `${rk[0].name} 승리!` : '대결 끝!') : '최종 순위'}</h3>
        ${myI >= 0 ? `<div class="ol-myrank">나는 <b>${myI + 1}등</b>!</div>` : ''}
        <div class="podium">${pod}</div>
        <div class="ol-tracks">${olTracks(room, this.me)}</div>
        <div class="ol-row center">${this.isHost ? `<button class="btn primary big" data-again>한 판 더 ↻</button><button class="btn ghost" data-close>방 닫기</button>` : `<p class="sub">선생님이 다음 판을 준비하면 자동으로 대기실로 가요</p><button class="btn small ghost" data-leave>나가기</button>`}</div>
      </div>
    </div>`);
    const r = this.root;
    if (this.isHost) {
      $('[data-again]', r).onclick = () => Net.update('rooms/' + this.pin, { status: 'lobby' });
      $('[data-close]', r).onclick = () => { Net.remove('rooms/' + this.pin); store.set('hostPin', null); };
    } else $('[data-leave]', r).onclick = () => { this.leave(true); this.entry(); };
  },
  resultUpdate() { const tr = $('.ol-result .ol-tracks', this.root); if (tr) tr.innerHTML = olTracks(this.room, this.me); },
  leave(removeMe) {
    if (this.unsub) { this.unsub(); this.unsub = null; }
    clearInterval(this.tick); clearInterval(this.cd); clearInterval(this.wt);
    if (this.pin && Net.ok && (removeMe || (this.room && this.room.mode === 'duel' && !this.isHost)) && this.isPlayer) {
      Net.remove(`rooms/${this.pin}/players/${this.me}`); Net.offDisc(`rooms/${this.pin}/players/${this.me}`);
    }
    if (this.pin && Net.ok && removeMe && this.room && this.room.mode === 'duel' && this.isHost) Net.remove('rooms/' + this.pin);
    this.joined = false; this.room = null; this.pin = null; this.view = '';
  },
  unmount() { this.leave(this.joined && this.room && !this.isHost); state.lang = store.get('lang', 'ko') === 'en' ? 'en' : 'ko'; }
};
MODES.online = { mount(root) { OL.mount(root, 'join'); }, unmount() { OL.unmount(); } };
MODES.online1v1 = MODES.online;
MODES.teacherRoom = { mount(root) { OL.mount(root, 'host'); }, unmount() { OL.unmount(); } };

boot();

</script>
