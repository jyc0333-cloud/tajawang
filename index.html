<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타닥타닥 타자왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 픽셀 디자인 ===== */
:root{
  --ink:#29213f; --ink2:#5d5578; --paper:#fff8e7; --sky:#cfeaff;
  --pink:#ff5c7a; --pink-d:#d93a5a; --yellow:#ffd84a; --green:#4fd17f; --green-d:#2e9e5a; --blue:#4da8ff; --purple:#9d7bff; --orange:#ff9f43;
  --ok:#1f9d55; --bad:#ff3d5a;
  --pw:4px; --bc:#29213f; --drop:rgba(41,33,63,.32); --bl:rgba(255,255,255,.6); --bd:rgba(0,0,0,.12);
  --f-ui:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Press Start 2P','Do Hyeon',monospace;
  --f-type:'Nanum Gothic Coding','D2Coding','Malgun Gothic',monospace;
  --pxs:#29213f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);background-image:linear-gradient(rgba(255,255,255,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:24px 24px;color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
b{font-weight:400;color:var(--pink-d)}
img.pxi,img.pxt-img{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle;user-select:none;-webkit-user-drag:none}
.pxt{display:inline-flex;align-items:center;line-height:1.15;font-family:var(--f-ui);font-weight:400;letter-spacing:.01em;text-shadow:-2px -2px 0 var(--pxs),0 -2px 0 var(--pxs),2px -2px 0 var(--pxs),2px 0 0 var(--pxs),2px 2px 0 var(--pxs),0 2px 0 var(--pxs),-2px 2px 0 var(--pxs),-2px 0 0 var(--pxs),3px 4px 0 var(--pxs)}
.hero h1.pxt{text-shadow:-3px -3px 0 var(--pxs),0 -3px 0 var(--pxs),3px -3px 0 var(--pxs),3px 0 0 var(--pxs),3px 3px 0 var(--pxs),0 3px 0 var(--pxs),-3px 3px 0 var(--pxs),-3px 0 0 var(--pxs),5px 7px 0 var(--pxs)}
.hidden{display:none!important}

/* 픽셀 테두리 (계단식 모서리) */
.panel,.btn,.mcard,.chip,.stat,.kb,.field,.hud-item,.type-input,.modal-card,.ov-card,.tcard,.lang-toggle,.icon-btn,.res-rows>div,.lang-pill,.tag,.mc-best,.bar,.tbar,.sign,.drop,.mv-word,.tblock,.tile,.res-best,.ov-best,.legend span,.key,.lane-key,.mem-card,.kq,.name-in,.db-bar{
  border:0!important;border-radius:0!important;
  box-shadow:0 calc(var(--pw)*-1) 0 0 var(--bc),0 var(--pw) 0 0 var(--bc),calc(var(--pw)*-1) 0 0 0 var(--bc),var(--pw) 0 0 0 var(--bc),
    calc(var(--pw)*1.6) calc(var(--pw)*1.6) 0 0 var(--drop),
    inset calc(var(--pw)*-1) calc(var(--pw)*-1) 0 0 var(--bd),inset var(--pw) var(--pw) 0 0 var(--bl);
}

/* 상단바 */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px clamp(12px,3vw,24px);background:var(--ink);box-shadow:0 4px 0 #000,0 8px 0 rgba(41,33,63,.25)}
.logo{background:none;border:0;display:flex;align-items:center;gap:8px;padding:2px 0;color:#fff;--pxs:#ff5c7a;font-size:22px;font-family:var(--f-ui)}
.top-right{display:flex;align-items:center;gap:14px}
.lang-toggle{display:flex;background:#fff;--pw:3px;--bc:#000}
.lang-toggle button{border:0;background:none;padding:5px 14px;font-size:17px}
.lang-toggle button.on{background:var(--yellow);color:var(--ink)}
.icon-btn{width:40px;height:38px;background:#fff;--pw:3px;--bc:#000;font-size:18px;display:grid;place-items:center}

main{max-width:1000px;margin:0 auto;padding:22px clamp(14px,3vw,26px) 70px}

/* 버튼 */
.btn{background:#fff;padding:9px 18px;font-size:18px;margin:4px;transition:transform .06s}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);--drop:transparent}
.btn.primary{background:var(--pink);color:#fff;--bl:rgba(255,255,255,.35);--bd:rgba(0,0,0,.2)}
.btn.small{padding:4px 11px;font-size:15px;--pw:3px}
.btn.big{padding:11px 26px;font-size:22px}
.btn:focus-visible,.chip:focus-visible,.mcard:focus-visible,.tcard:focus-visible{outline:4px dashed var(--pink);outline-offset:6px}

/* 처음 화면 */
.hero{text-align:center;padding:14px 0 6px}
.hero-keys{display:flex;justify-content:center;gap:14px;margin-bottom:12px}
.hero-keys span{display:grid;place-items:center;width:56px;height:56px;background:#fff;font-size:28px;--pw:4px;box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),0 10px 0 var(--ink),inset -4px -4px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.6);animation:keyBounce 4.8s ease-in-out infinite}
.hero-keys span:nth-child(1){background:#ff9ec7}.hero-keys span:nth-child(2){background:var(--yellow);animation-delay:.4s}.hero-keys span:nth-child(3){background:#8be28b;animation-delay:.8s}.hero-keys span:nth-child(4){background:#7cc7ff;animation-delay:1.2s}
@keyframes keyBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(4px)}}
.hero h1{font-size:56px;margin:8px 0 6px;color:#fff;--pxs:#29213f;font-weight:400;font-family:var(--f-ui)}
.hero p{margin:0;color:var(--ink2)}
.sec-title{font-size:28px;margin:34px 0 14px;display:flex;align-items:center;gap:10px;font-weight:400;flex-wrap:wrap;color:var(--ink);--pxs:#fff}
.sec-title small{font-size:15px;color:var(--ink2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:20px}
.mcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:16px 16px 14px;min-height:150px;margin:4px;transition:transform .08s}
.mcard:hover{transform:translate(-2px,-3px)}
.mcard:hover .mc-icon img{animation:hop 1s steps(2) infinite}
.mcard:active{transform:translate(3px,3px);--drop:transparent}
.mc-icon{margin-bottom:auto;padding-bottom:10px}
.mc-name{font-size:23px;line-height:1.2}
.mc-desc{font-size:15px;color:rgba(41,33,63,.72)}
.mc-best{position:absolute;top:12px;right:12px;background:#fff;--pw:2px;padding:1px 7px;font-size:13px;display:flex;align-items:center;gap:3px;--drop:transparent}
.c1{background:#ffb86b}.c2{background:#8be28b}.c3{background:#7cc7ff}.c4{background:#c9a2ff}.c5{background:#6fe0d2}.c6{background:#ff9ec7}.c7{background:#ffe066}.c8{background:#ff8a80}.c9{background:#b4e36b}
@keyframes hop{50%{transform:translateY(-4px)}}
.panel.tips{margin:56px 4px 8px;padding:24px 28px}
.tips>b{color:var(--ink);display:flex;align-items:center;gap:8px;font-size:21px;margin-bottom:14px}
.tips ul{margin:0;padding-left:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px 36px;font-size:18px;line-height:1.6}
.tips li::marker{content:'▶ ';color:var(--pink)}
.tips li b{display:inline;color:var(--pink-d);font-size:inherit}

/* 공통 모드 */
.panel{background:var(--paper);padding:20px;margin:4px}
.mode-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.mode-head h2{font-size:30px;margin:0;display:flex;align-items:center;gap:8px;font-weight:400;color:#29213f;--pxs:#ffffff}
.lang-pill{margin-left:auto;padding:3px 12px;background:var(--yellow);--pw:3px}
.lang-pill.en{background:#7cc7ff}
.sub{color:var(--ink2);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:4px 4px 18px}
.chips.center{justify-content:center}
.chip-gap{width:12px}
.chip{background:#fff;padding:5px 12px;font-size:16px;--pw:3px;--drop:rgba(41,33,63,.22)}
.chip small{font-family:var(--f-num);font-size:9px;color:var(--ink2);margin-left:3px}
.chip.on{background:var(--ink);color:#fff;--bl:rgba(255,255,255,.15)}
.chip.on small{color:#cfc8e6}
.hint{text-align:center;color:var(--ink2);font-size:15px;margin:16px 0 0}
.hint.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.legend span{background:#fff;padding:1px 9px;--pw:2px;--drop:transparent;font-size:14px}
.muted{color:#aaa}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.stat{background:#fff;padding:6px 10px;text-align:center;--pw:3px;--drop:transparent}
.stat span{display:block;font-size:13px;color:var(--ink2)}
.stat b{font-family:var(--f-num);font-size:17px;line-height:1.8;color:var(--ink)}
.bar{height:14px;background:#e9e2d0;margin-top:16px;overflow:hidden;--pw:3px;--drop:transparent;--bl:transparent}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 10px,#7be3a3 10px 14px);transition:width .3s steps(6)}

/* 글자 표시 */
.typing-text{font-family:var(--f-type);font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.75;letter-spacing:.02em;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:#9a93b3}
.typing-text.big{font-size:clamp(22px,3.6vw,32px);color:#7a7396}
.ch.ok{color:var(--ok)}
.ch.bad{color:#fff;background:var(--bad)}
.ch.pending{color:var(--ink);text-decoration:underline 3px solid var(--pink);text-underline-offset:5px}
.ch.cur{color:var(--ink);background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
.ch.sp.cur,.ch.sp.bad{padding:0 .15em}

/* 입력창 */
.type-form{margin:20px 4px 4px}
.type-input{width:100%;font-family:var(--f-type);font-weight:700;font-size:22px;padding:13px 16px;background:#fff;color:var(--ink);outline:none;--drop:transparent}
.type-input:focus{--bc:var(--pink);background:#fffdf4}
.type-input:disabled{background:#eee8da;color:#999}
.type-input::placeholder{color:#b5ad9c;font-weight:400;font-family:var(--f-ui);font-size:18px}

/* 자판 */
.kb-tools{display:flex;justify-content:flex-end;margin:16px 4px 6px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sw{width:46px;height:24px;background:#ddd;position:relative;box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink)}
.switch .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--ink);transition:transform .1s steps(2)}
.switch input:checked+.sw{background:var(--green)}
.switch input:checked+.sw::after{transform:translateX(22px);background:#fff}
.switch input:focus-visible+.sw{outline:3px dashed var(--pink);outline-offset:5px}
.kb-host{margin-top:16px}
.kb{background:#e9e2d0;padding:14px;display:flex;flex-direction:column;gap:9px;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:4px}
.kb-row{display:flex;gap:9px}
.kb-row:last-child{justify-content:center}
.kb-row:last-child .key{flex-basis:0;max-width:52%}
.key{flex:1 1 0;min-width:0;height:46px;position:relative;display:grid;place-items:center;font-size:19px;cursor:pointer;--pw:2px;--drop:rgba(41,33,63,.35)}
.key.fn{font-size:13px;background:#f6f1e4!important;color:var(--ink2)}
.k-sub{position:absolute;top:1px;left:5px;font-size:11px;color:var(--ink2)}
.k-corner{position:absolute;bottom:0;right:4px;font-size:9px;color:var(--ink2);font-family:var(--f-num);font-size:7px}
.key.bump .k-main{text-decoration:underline 2px;text-underline-offset:4px}
.f0,.f7{background:#ffc2d6}.f1,.f6{background:#ffd7a8}.f2,.f5{background:#fff1a0}.f3{background:#bff0b8}.f4{background:#b5dcff}.f8{background:#e8e4f2}
.key.target{background:var(--pink)!important;color:#fff;transform:translateY(-3px);animation:blink 1.6s steps(2) infinite;z-index:1}
.key.target .k-sub,.key.target .k-corner{color:#ffe1e8}
.key.hit-ok{background:var(--green)!important;transform:translateY(2px);--drop:transparent}
.key.hit-bad{background:var(--bad)!important;color:#fff;animation:shake .25s steps(4)}
.kb.vshift [data-code^=Shift]{background:var(--ink)!important;color:#fff}
@keyframes blink{50%{--bc:#fff;filter:brightness(1.15)}}

/* 자리 연습 */
.key-queue{display:flex;justify-content:center;align-items:center;gap:14px;min-height:100px;overflow:hidden;padding:8px}
.kq{display:grid;place-items:center;flex:0 0 auto;width:50px;height:50px;font-size:26px;color:#a19ab8;background:#fff;--pw:3px;--drop:transparent}
.kq.done{color:var(--ok);opacity:.55;width:40px;height:40px;font-size:20px}
.kq.cur{width:84px;height:84px;font-size:46px;color:var(--ink);background:var(--yellow);--pw:4px;--drop:rgba(41,33,63,.35)}
.finger-tip{text-align:center;font-size:18px;margin-top:10px;min-height:28px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.fdot{width:18px;height:18px;display:inline-block;box-shadow:0 0 0 3px var(--ink)}
.shift-tag{background:var(--ink);color:#fff;padding:1px 8px;font-size:15px}

/* 낱말/문장 */
.cat-chips{gap:10px}
.word-area{text-align:center}
.w-prev{min-height:28px;font-size:17px;font-family:var(--f-type);font-weight:700}
.w-prev .ok{color:var(--ok)}.w-prev .bad{color:var(--bad);text-decoration:line-through}
.w-cur{font-size:clamp(38px,8vw,62px);line-height:1.4;margin:6px 0}
.w-next{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:#a9a2bf;font-family:var(--f-type);font-weight:700;font-size:18px}
.w-next span:first-child{color:var(--ink2)}
.sent-num{font-family:var(--f-num);font-size:12px;color:var(--ink2);margin-bottom:10px}
.sent-next{margin-top:14px;color:#9a93b3;font-family:var(--f-type);font-weight:700;font-size:16px}
.tag{display:inline-block;background:var(--ink);color:#fff;padding:0 7px;font-family:var(--f-ui);font-weight:400;font-size:13px;margin-right:8px;--pw:2px;--drop:transparent;--bl:transparent}

/* 긴 글 */
.text-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.tcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;padding:14px 16px 14px 22px;margin:4px;position:relative;transition:transform .08s}
.tcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c,var(--pink))}
.tcard:nth-child(5n+2){--c:var(--green)}.tcard:nth-child(5n+3){--c:var(--blue)}.tcard:nth-child(5n+4){--c:var(--purple)}.tcard:nth-child(5n+5){--c:var(--orange)}
.tcard:hover{transform:translate(-2px,-2px)}
.tcard b{font-size:21px;color:var(--ink)}
.tcard span{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard em{font-style:normal;font-size:13px;color:#8d86a3}
.long-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.long-top h3{font-size:24px;margin:0;font-weight:400}
.long-panel{margin-top:16px;max-height:min(58vh,560px);overflow:auto;padding:14px;scroll-behavior:smooth}
.lline{padding:8px 12px;margin-bottom:6px}
.lline .ltxt{font-size:clamp(18px,2.6vw,23px);color:#b6afc8}
.lline.cur{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--ink)}
.lline.cur .ltxt{color:#6c6588}
.lline.done{opacity:.85}
.lline .type-form{margin:8px 2px 2px}
.lline .type-input{font-size:20px;padding:10px 14px}

/* 게임 공통 */
.game-hud{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:4px 4px 16px}
.hud-item{background:#fff;padding:4px 12px;font-size:16px;display:flex;align-items:center;gap:7px;--pw:3px;--drop:transparent}
.hud-item b{font-family:var(--f-num);font-size:14px;color:var(--ink)}
.hud-item:empty{display:none}
.game-hud .g-pause{margin-left:auto}
.g-hearts{gap:2px}
.g-hearts span{transition:opacity .2s}
.g-hearts span.lost{opacity:.2;filter:grayscale(1)}
.combo{color:#e8590c;animation:pop .3s steps(3)}
.field{position:relative;overflow:hidden;margin:4px;--bl:transparent;--bd:transparent}
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(41,33,63,.55);padding:14px;overflow:auto}
.overlay.show{display:grid}
.ov-card{background:var(--paper);padding:16px 22px;text-align:center;max-width:460px;width:100%;animation:popIn .2s steps(3)}
.ov-card .ov-icon img{width:56px;height:56px}
.ov-card h3{font-size:25px;margin:4px 0 8px;font-weight:400;color:var(--ink);--pxs:#ffd84a}
.ov-icon{line-height:1}
.rules{text-align:left;margin:0 0 12px;padding-left:20px;color:var(--ink2);font-size:15px;line-height:1.45}
.rules li{margin:3px 0}
.rules li::marker{content:'▶ ';color:var(--pink)}
.lv-pick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 14px}
.lv-pick .chip{font-size:15px;padding:3px 9px}
.ov-best{background:#fff3c4;padding:3px 10px;margin:0 auto 12px;display:inline-flex;align-items:center;gap:6px;--pw:2px;--drop:transparent}
.ov-small{font-size:13px;color:#8d86a3;margin-top:8px}
.count{font-family:var(--f-num);font-size:90px;color:var(--yellow);text-shadow:6px 6px 0 var(--ink);animation:countPop .5s steps(4)}
.count.go{font-size:46px;color:var(--green)}
.float{position:absolute;z-index:15;font-family:var(--f-num);font-size:16px;color:var(--ok);text-shadow:2px 2px 0 #fff;pointer-events:none;animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.float.gold{color:#e09b00}.float.bad{color:var(--bad)}
.level-banner{position:absolute;left:50%;top:40%;z-index:16;transform:translate(-50%,-50%);font-size:52px;color:var(--yellow);--pxs:#29213f;animation:banner 1.2s steps(10) forwards;white-space:nowrap;font-family:var(--f-ui)}
.game-form{margin-top:20px}
.game-form .type-input{font-size:24px;text-align:center}
.tbar{height:12px;background:#e9e2d0;overflow:hidden;width:90px;--pw:2px;--drop:transparent;--bl:transparent}
.tbar.wide{width:140px}
.tbar i{display:block;height:100%;width:100%;background:var(--green);transition:width .2s linear}
.time-wrap.danger b{color:var(--bad)}.time-wrap.danger .tbar i{background:var(--bad)}

/* 산성비 */
.rain-field{height:clamp(340px,56vh,560px);background:linear-gradient(#a9d8ff,#e4f3ff 70%);--bc:var(--ink)}
.rain-field::before{content:'';position:absolute;inset:-60px 0 0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(70,140,220,.22) 46px 50px,transparent 50px 96px);-webkit-mask:repeating-linear-gradient(transparent 0 14px,#000 14px 26px);mask:repeating-linear-gradient(transparent 0 14px,#000 14px 26px);animation:rainfall 1.8s linear infinite;pointer-events:none}
@keyframes rainfall{from{transform:translateY(0)}to{transform:translateY(26px)}}
.clouds{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none;z-index:2}
.clouds span{animation:drift 14s ease-in-out infinite alternate}.clouds span:nth-child(2n){animation-delay:-3s}
.drops{position:absolute;inset:0}
.drop{position:absolute;top:0;left:0;z-index:5;background:#fff;padding:3px 11px;font-family:var(--f-type);font-weight:700;font-size:19px;white-space:nowrap;will-change:transform;display:flex;align-items:center;gap:5px;--pw:3px;--drop:rgba(41,33,63,.3)}
.drop.gold{background:var(--yellow)}.drop.ice{background:#d4f5ff}.drop.bomb{background:#ffc9c9}.drop.heal{background:#ffd9ee}
.drop.pop,.mover.pop{animation:dropPop .35s steps(4) forwards}
.drop.splash,.mover.escape{animation:splash .4s steps(4) forwards}
.rain-field.frozen{--bc:#3aa7d6}
.rain-field.frozen .drop{background:#e9fbff;--bc:#3aa7d6}
.rain-field.flash::after,.ta-field.flash-ok::after{content:'';position:absolute;inset:0;background:#fff;animation:flash .4s steps(4) forwards;z-index:12;pointer-events:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:#6cc96a;box-shadow:inset 0 4px 0 #8fe28c,0 -4px 0 var(--ink);z-index:6}
.city{position:absolute;left:0;right:0;top:-30px;display:flex;justify-content:space-around;pointer-events:none}

/* 두더지 */
.mole-field{background:#8fd97f;background-image:linear-gradient(45deg,#84cf73 25%,transparent 25%,transparent 75%,#84cf73 75%),linear-gradient(45deg,#84cf73 25%,transparent 25%,transparent 75%,#84cf73 75%);background-size:24px 24px;background-position:0 0,12px 12px;padding:14px}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.hole{position:relative;height:clamp(108px,16vh,150px);overflow:hidden}
.hole::before{content:'';position:absolute;left:50%;width:min(150px,76%);transform:translateX(-50%);bottom:10px;height:26px;background:#3b2618;box-shadow:0 -4px 0 #3b2618,0 4px 0 #3b2618}
.mole-wrap{position:absolute;left:50%;bottom:14px;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,115%);transition:transform .15s steps(3)}
.hole.up .mole-wrap{transform:translate(-50%,0)}
.hole.hit .mole-wrap{transform:translate(-50%,12%)}
.sign{background:#fff;padding:1px 9px;font-family:var(--f-type);font-weight:700;font-size:17px;white-space:nowrap;margin-bottom:6px;position:relative;z-index:1;--pw:3px;--drop:transparent}
.hole.gold .sign{background:var(--yellow)}
.mole{width:clamp(70px,10vh,96px);height:clamp(64px,9vh,88px)}
.mole img{width:100%;height:100%;image-rendering:pixelated}
.mole .m-hit{display:none}
.hole.hit .mole .m-norm{display:none}.hole.hit .mole .m-hit{display:block}
.hole.gold .mole img{filter:drop-shadow(0 0 0 #ffd400) drop-shadow(3px 0 0 #ffd400) drop-shadow(-3px 0 0 #ffd400)}
.stars{position:absolute;top:30px;display:none;animation:spin 1.4s steps(4) infinite}
.hole.hit .stars{display:block}
.hole.hit .sign{background:var(--green);color:#fff}
.mound{position:absolute;left:50%;width:min(190px,94%);transform:translateX(-50%);bottom:0;height:22px;background:#8a5a3b;z-index:3;box-shadow:0 -4px 0 var(--ink),inset 0 4px 0 #a8754f;clip-path:polygon(8% 0,92% 0,100% 30%,100% 100%,0 100%,0 30%)}

/* 레이싱 */
.track{background:#5b6170;padding:6px 0}
.lane{position:relative;height:66px;border-bottom:4px dashed rgba(255,255,255,.35)}
.lane:last-of-type{border-bottom:0}
.lane.me{background:rgba(255,216,74,.22)}
.lane-no{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6);font-family:var(--f-num);font-size:14px}
.runner{--p:0;position:absolute;top:50%;left:calc(34px + var(--p) * (100% - 128px));transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;transition:left .2s linear;z-index:2}
.r-emo{line-height:1;display:inline-block;transform:scaleX(-1)}
.r-name{font-size:13px;color:#fff;background:rgba(0,0,0,.45);padding:0 6px;margin-top:1px;white-space:nowrap}
.lane.me .r-name{background:var(--pink)}
.finish-line{position:absolute;right:60px;top:0;bottom:0;width:16px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/8px 8px}
.race-panel{margin-top:20px}

/* 시간 폭탄 */
.bomb-field{height:280px;background:#2b2450;background-image:radial-gradient(#fff 1.5px,transparent 1.5px);background-size:40px 40px;display:grid;place-items:center}
.bomb{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-20px}
.bomb-img{animation:wobble 2.4s steps(2) infinite}
.bomb-body{margin-top:-8px;background:var(--ink);color:#fff;padding:6px 14px;font-family:var(--f-num);box-shadow:0 0 0 4px #000,0 0 0 8px #fff;display:flex;align-items:baseline;gap:4px}
.b-time{font-size:26px}
.bomb-body small{font-family:var(--f-ui);font-size:15px}
.boom-fx{position:absolute;inset:0;display:none;place-items:center;z-index:5}
.bomb-field .tbar.big{position:absolute;bottom:16px;left:10%;width:80%;height:16px;--bc:#000}
.bomb-field .tbar.big i{background:repeating-linear-gradient(90deg,var(--yellow) 0 12px,var(--orange) 12px 16px)}
.bomb-field.danger{animation:alarm 1.2s steps(2) infinite}
.bomb-field.danger .bomb-img{animation:wobble .6s steps(2) infinite}
.bomb-field.danger .bomb-body{background:var(--bad)}
.bomb-field.danger .tbar.big i{background:var(--bad)}
.bomb-field.boom .bomb{visibility:hidden}
.bomb-field.boom .boom-fx{display:grid;animation:countPop .5s steps(4)}
.bomb-panel{margin-top:20px;transition:filter .2s}
.bomb-panel.blur .bomb-line{filter:blur(8px)}
@keyframes wobble{50%{transform:rotate(-6deg)}}
@keyframes alarm{50%{background-color:#4a1d3a}}

/* 움직이는 낱말 (좀비·풍선·낚시) */
.mover-field{height:clamp(360px,58vh,560px)}
.movers{position:absolute;inset:0;z-index:5}
.mover{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.mv-word{background:#fff;padding:1px 9px;font-family:var(--f-type);font-weight:700;font-size:18px;white-space:nowrap;--pw:3px;--drop:rgba(0,0,0,.25);margin:3px}
.mover.caught{animation:caught .6s steps(6) forwards}
.mover.boom{animation:splash .3s steps(3) forwards}
.zombie-field{background:linear-gradient(#1f1940,#3d3170 70%)}
.z-moon{position:absolute;top:16px;right:24px}
.z-stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1.5px,transparent 1.5px),radial-gradient(#ffd84a 1.5px,transparent 1.5px);background-size:70px 60px,110px 90px;background-position:10px 10px,40px 30px;opacity:.6;height:45%}
.z-ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:#3c6b3a;box-shadow:0 -4px 0 #000,inset 0 4px 0 #5a9356;z-index:3}
.z-fence{position:absolute;left:52px;top:28%;bottom:40px;width:16px;background:repeating-linear-gradient(#c79a5f 0 22px,#8a6234 22px 26px);box-shadow:0 0 0 3px #000;z-index:4}
.z-home{position:absolute;left:-8px;bottom:36px;z-index:4}
.z-grave{position:absolute;bottom:40px;z-index:2;opacity:.8}.z-grave.g1{left:42%}.z-grave.g2{left:72%}
.z-tree{position:absolute;bottom:40px;left:20%;opacity:.7;z-index:2}
.zom .mv-word{margin-bottom:2px}
.zom.bat .mv-word{background:#e9dcff}.zom.ghost .mv-word{background:#fff3c4}
.balloon-field{background:linear-gradient(#8fd0ff,#e6f6ff 75%)}
.b-cloud{position:absolute;opacity:.9;animation:drift 16s ease-in-out infinite alternate}.b-cloud.bc1{top:40px;left:12%}.b-cloud.bc2{top:110px;right:14%;animation-delay:-4s}
.b-sun{position:absolute;top:14px;right:18px}
.b-grass{position:absolute;left:0;right:0;bottom:0;height:28px;background:#6cc96a;box-shadow:0 -4px 0 var(--ink);z-index:6}
.bal .b-img{filter:hue-rotate(var(--hue))}
.bal .b-string{width:2px;height:12px;background:var(--ink);margin-top:-4px}
.bal .mv-word{margin-top:0}
.bal.bad .mv-word{background:#333;color:#fff}
.bal.gift .mv-word{background:var(--yellow)}
.fish-field{background:linear-gradient(#5cc2ff 0%,#2f86d6 55%,#1d4f9c 100%)}
.sea-sky{position:absolute;left:0;right:0;top:0;height:20%;background:#cfeaff;box-shadow:0 4px 0 #fff,0 8px 0 #8fd3ff;z-index:1}
.boat{position:absolute;top:calc(20% - 52px);left:20px;z-index:3;animation:bob 3s ease-in-out infinite}
.sea-floor{position:absolute;left:0;right:0;bottom:0;height:32px;background:#e8cf8a;box-shadow:0 -4px 0 #b99a52;z-index:3}
.weed{position:absolute;bottom:22px;z-index:2}.weed.w1{left:8%}.weed.w2{left:46%}.weed.w3{right:10%}
.bubbles i{position:absolute;bottom:30px;width:8px;height:8px;background:rgba(255,255,255,.6);animation:bubble 8s linear infinite}
.bubbles i:nth-child(1){left:15%}.bubbles i:nth-child(2){left:38%;animation-delay:-1s}.bubbles i:nth-child(3){left:63%;animation-delay:-2.2s}.bubbles i:nth-child(4){left:85%;animation-delay:-3s}
.fishy.right .f-img{transform:scaleX(-1)}
.fishy .mv-word{margin-top:-2px}
@keyframes caught{to{translate:0 -260px;opacity:0}}
@keyframes bob{50%{transform:translateY(4px)}}
@keyframes bubble{from{transform:translateY(0);opacity:.8}to{transform:translateY(-300px);opacity:0}}

/* 탑 쌓기 */
.tower-field{height:clamp(400px,60vh,580px);background:linear-gradient(#7cc7ff,#d8f0ff)}
.tw-sky .tw-cloud{position:absolute;animation:drift 16s ease-in-out infinite alternate}.tw-cloud.a{top:80px;left:8%}.tw-cloud.b{top:150px;right:10%;animation-delay:-3s}
.tw-word{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:8;background:#fff;padding:2px 16px;white-space:nowrap;box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),6px 6px 0 rgba(41,33,63,.3)}
.tw-stage{position:absolute;left:0;right:0;top:80px;bottom:30px;overflow:hidden}
.tw-stack{position:absolute;left:50%;bottom:0;transform:translate(-50%,0);display:flex;flex-direction:column-reverse;align-items:center;transition:transform .3s steps(4)}
.tblock{min-width:110px;text-align:center;padding:4px 14px;margin:4px 0 0;font-family:var(--f-type);font-weight:700;font-size:17px;--pw:3px;--drop:transparent;animation:dropIn .25s steps(4)}
.tblock.c0{background:#ff9ec7}.tblock.c1{background:#ffb86b}.tblock.c2{background:#ffe066}.tblock.c3{background:#8be28b}.tblock.c4{background:#7cc7ff}.tblock.c5{background:#c9a2ff}
.tblock.gold{background:var(--yellow);color:var(--pink-d)}
.tblock.fall{animation:fallOff .45s steps(5) forwards}
.tw-ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:#6cc96a;box-shadow:0 -4px 0 var(--ink);z-index:6}
@keyframes dropIn{from{transform:translateY(-40px);opacity:0}}
@keyframes fallOff{to{transform:translate(80px,120px) rotate(40deg);opacity:0}}

/* 자판 리듬 */
.rhythm-field{height:clamp(380px,58vh,520px);background:#231c3d}
.lanes{position:absolute;inset:0;display:flex}
.lane-col{flex:1;position:relative;border-right:2px dashed rgba(255,255,255,.12);background:transparent!important;cursor:pointer}
.lane-col:last-child{border-right:0}
.lane-col.press{animation:lanePress .18s steps(2)}
.notes{position:absolute;inset:0 0 56px}
.note{position:absolute;top:0;left:12%;right:12%;height:22px;background:var(--nc,#fff);box-shadow:0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000,inset 0 4px 0 rgba(255,255,255,.5)}
.lane-col.f0 .note,.lane-col.f7 .note{--nc:#ff8fb6}.lane-col.f1 .note,.lane-col.f6 .note{--nc:#ffb86b}.lane-col.f2 .note,.lane-col.f5 .note{--nc:#ffe066}.lane-col.f3 .note{--nc:#7ee08a}.lane-col.f4 .note{--nc:#7cc7ff}
.note.hitn{animation:dropPop .25s steps(3) forwards}
.note.miss{opacity:.25}
.lane-key{position:absolute;left:8%;right:8%;bottom:8px;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;background:#fff;--pw:3px;--drop:transparent}
.lane-key small{font-family:var(--f-num);font-size:7px;color:var(--ink2);margin-top:3px}
.lane-col.f0 .lane-key,.lane-col.f7 .lane-key{background:#ffc2d6}.lane-col.f1 .lane-key,.lane-col.f6 .lane-key{background:#ffd7a8}.lane-col.f2 .lane-key,.lane-col.f5 .lane-key{background:#fff1a0}.lane-col.f3 .lane-key{background:#bff0b8}.lane-col.f4 .lane-key{background:#b5dcff}
.hit-line{position:absolute;left:0;right:0;bottom:58px;height:4px;background:var(--yellow);box-shadow:0 0 0 2px #000;z-index:2;pointer-events:none}
.judge{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-num);font-size:26px;color:#fff;text-shadow:4px 4px 0 #000;z-index:3;opacity:0;pointer-events:none;white-space:nowrap}
.judge.show{animation:judgeIn .5s steps(5) forwards}
.judge.perfect{color:var(--yellow)}.judge.great{color:#7ee08a}.judge.good{color:#7cc7ff}.judge.miss{color:#ff6b81}
@keyframes lanePress{from{background:rgba(255,255,255,.18)!important}}
@keyframes judgeIn{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}30%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%)}}

/* 기억력 */
.mem-field{min-height:340px;background:#c9a2ff;background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2px);background-size:20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:22px}
.mem-card{background:#fff;padding:22px 28px;min-width:min(520px,90%);min-height:100px;display:grid;place-items:center;text-align:center;--pw:5px}
.mem-card.hide{background:#3a2f63}.mem-card.hide .ch.q{color:var(--yellow)}
.mem-card.good{background:#d9ffe4}.mem-card.meh{background:#fff3c4}
.mem-bar{width:min(420px,80%);height:14px}
.mem-bar i{transition:none}
.mem-fb{min-height:28px;font-size:20px;color:var(--ink)}
.g-phase{color:var(--pink-d)}

/* 빈칸 · 뒤죽박죽 · 타임어택 */
.blank-field,.scr-field,.ta-field,.duel-field{min-height:320px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:18px;text-align:center}
.blank-sent{font-family:var(--f-type);font-weight:700;font-size:clamp(22px,3.8vw,32px);line-height:1.8;word-break:keep-all}
.blank{display:inline-block;background:var(--yellow);color:var(--ink);padding:0 6px;margin:0 2px;letter-spacing:.1em;box-shadow:0 0 0 3px var(--ink)}
.blank.ok{background:var(--green);color:#fff}.blank.no{background:var(--bad);color:#fff}
.blank-fb{min-height:28px;font-size:20px}
.blank-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.scr-field{background:#ffe9a8}
.tiles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.tile{width:62px;height:62px;display:grid;place-items:center;background:#fff;font-family:var(--f-type);font-weight:700;font-size:32px;transform:rotate(var(--r));animation:tileIn .3s steps(3) backwards;animation-delay:var(--d)}
.tile.right{background:var(--green);color:#fff;transform:none}
.scr-hint{min-height:26px;font-size:18px}
@keyframes tileIn{from{transform:translateY(-30px);opacity:0}}
.ta-field{background:#d4f7ef}
.ta-word{font-size:clamp(40px,9vw,68px);color:#8c86a5}
.ta-next{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--f-type);font-weight:700;color:#8c86a5;font-size:18px}

/* 친구 대결 */
.duel-setup{text-align:center}
.duel-names{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0 20px}
.duel-names label{display:flex;align-items:center;gap:8px}
.name-in{font-family:var(--f-ui);font-size:20px;padding:8px 12px;width:170px;background:#fff;outline:none;--drop:transparent}
.name-in:focus{--bc:var(--pink)}
.vs{font-size:34px;color:var(--pink);--pxs:#29213f}
.duel-field{min-height:200px}
.duel-result{text-align:center}
.duel-result h3{font-size:34px;margin:8px 0 18px;font-weight:400;color:var(--ink);--pxs:#ffd84a}
.duel-bars{display:grid;gap:22px;margin:0 auto 22px;max-width:560px;text-align:left}
.db-name{display:flex;align-items:center;gap:6px;font-size:19px;margin-bottom:6px}
.db-bar{position:relative;height:34px;background:#fff;--pw:3px;--drop:transparent}
.db-bar i{position:absolute;left:0;top:0;bottom:0;background:#b5dcff}
.db.win .db-bar i{background:var(--yellow)}
.db-bar b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-num);font-size:13px;color:var(--ink)}
.db-sub{font-size:14px;color:var(--ink2);margin-top:6px}

/* 모달 & 토스트 */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(41,33,63,.6);padding:16px}
.modal.show{display:grid}
.modal-card{background:var(--paper);padding:24px;width:min(440px,100%);text-align:center;--pw:5px;animation:popIn .2s steps(3)}
.modal-card h3{font-size:30px;margin:6px 0 4px;font-weight:400;color:var(--ink);--pxs:#ffd84a;justify-content:center;display:flex}
.res-grade{color:var(--ink2);font-size:16px}
.res-big{font-family:var(--f-num);font-size:44px;color:var(--pink);line-height:1.3;margin:12px 0 4px;text-shadow:4px 4px 0 var(--ink)}
.res-big small{font-family:var(--f-ui);font-size:20px;color:var(--ink);text-shadow:none;margin-left:6px}
.res-best{display:inline-block;background:var(--yellow);padding:2px 12px;--pw:3px;animation:blink2 1.6s steps(2) infinite}
.res-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:20px 4px 22px}
.res-rows>div{background:#fff;padding:6px 8px;--pw:3px;--drop:transparent}
.res-rows span{display:block;font-size:13px;color:var(--ink2)}
.res-rows b{font-size:19px;color:var(--ink)}
.res-btns{display:flex;gap:10px;justify-content:center}
.res-btns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,180%);opacity:0;visibility:hidden;background:var(--ink);color:#fff;padding:10px 20px;font-size:16px;box-shadow:0 -4px 0 #000,0 4px 0 #000,-4px 0 0 #000,4px 0 0 #000;transition:transform .2s steps(3);max-width:92vw;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast b{color:var(--yellow)}
@keyframes blink2{50%{filter:brightness(1.2)}}

/* 애니메이션 */
.shake{animation:shake .3s steps(4)}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-4px 0}}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes countPop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floatUp{from{translate:0 0;opacity:1}to{translate:0 -50px;opacity:0}}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes dropPop{to{scale:1.7;opacity:0}}
@keyframes splash{to{opacity:0}}
@keyframes flash{from{opacity:.8}to{opacity:0}}
@keyframes drift{from{translate:-14px 0}to{translate:14px 0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 모바일 */
@media (max-width:720px){
  :root{--pw:3px}
  .mgrid{grid-template-columns:repeat(2,1fr);gap:16px}
  .mcard{min-height:132px;padding:12px 12px}
  .mc-name{font-size:20px}
  .mc-desc{font-size:13px}
  .tips ul{grid-template-columns:1fr;gap:12px}
  .panel.tips{padding:20px;margin-top:48px}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:12px}
  .key{height:36px;font-size:15px}
  .kb{padding:8px;gap:6px}.kb-row{gap:5px}
  .k-sub,.k-corner{display:none}
  .key.fn{font-size:10px}
  .rain-field,.mover-field{height:clamp(300px,46vh,460px)}
  .drop,.mv-word{font-size:15px;padding:2px 8px}
  .hole{height:118px}
  .sign{font-size:13px;padding:1px 6px}
  .mole{width:64px;height:58px}
  .bomb-field{height:240px}
  .game-hud{gap:10px}
  .hud-item{padding:3px 9px;font-size:14px}
  .hud-item b{font-size:12px}
  .tower-field{height:clamp(300px,48vh,460px)}
  .ov-card{padding:12px 14px}
  .ov-card h3{font-size:21px}
  .ov-card .ov-icon img{width:44px;height:44px}
  .rules{font-size:14px;padding-left:16px}
  .lv-pick{margin-bottom:10px}
  .btn.big{padding:9px 20px;font-size:19px}
  .tile{width:50px;height:50px;font-size:26px}
  .lane-key{font-size:16px}
  .judge{font-size:18px}
  .hero h1{font-size:40px}
  .cat-chips{flex-wrap:nowrap;overflow-x:auto;padding:6px 4px 12px;margin-bottom:8px;scrollbar-width:thin}
  .cat-chips .chip{flex:0 0 auto}
}
@media (max-width:480px){
  .logo .lg-txt{display:none}

/* ===== 온라인 대결 ===== */
.ol-info{text-align:center}
.ol-info h3,.ol-setup h3,.ol-join h3,.ol-make h3{font-size:26px;margin:6px 0 12px;font-weight:400;color:var(--ink);--pxs:#ffd84a}
.ol-setup ol{padding-left:22px;line-height:1.8}
.ol-setup a{color:var(--pink-d)}
.ol-code{background:var(--ink);color:#bff0b8;font-family:var(--f-type);font-size:14px;padding:12px 16px;overflow:auto;box-shadow:0 0 0 3px #000}
.ol-cfg{width:100%;font-family:var(--f-type);font-size:14px;padding:10px;border:0;box-shadow:0 0 0 3px var(--ink);background:#fff;margin:10px 0}
.ol-msg{color:var(--bad);min-height:22px}
.ol-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ol-row.center{justify-content:center}
.ol-entry{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.ol-lab{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:16px;color:var(--ink2)}
.ol-pin,.ol-name,.ol-name2{font-family:var(--f-ui);font-size:22px;padding:10px 14px;border:0;outline:none;background:#fff;box-shadow:0 0 0 3px var(--ink)}
.ol-pin{font-family:var(--f-num);font-size:28px;letter-spacing:.3em;text-align:center}
.ol-pin:focus,.ol-name:focus,.ol-name2:focus{box-shadow:0 0 0 3px var(--pink)}
.ol-avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:16px}
.ol-av{background:#fff;border:0;padding:4px;box-shadow:0 0 0 2px #ddd}
.ol-av.on{background:var(--yellow);box-shadow:0 0 0 3px var(--ink)}
.ol-make p{color:var(--ink2)}
.ol-lobby{display:grid;grid-template-columns:1fr 1.15fr;gap:22px}
.ol-pinbox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.ol-pin-label{font-size:18px;color:var(--ink2)}
.ol-pin-big{font-family:var(--f-num);font-size:clamp(48px,9vw,86px);color:var(--pink);text-shadow:6px 6px 0 var(--ink);letter-spacing:.08em;line-height:1.2}
.ol-qr img{width:200px;height:200px;image-rendering:pixelated;box-shadow:0 0 0 4px var(--ink);background:#fff}
.ol-url{display:flex;gap:6px;width:100%}
.ol-url input{flex:1;min-width:0;font-size:12px;padding:6px;border:0;box-shadow:0 0 0 2px var(--ink);font-family:var(--f-type)}
.ol-set-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ol-set-row>span{width:62px;color:var(--ink2)}

.ol-gi{background:#fff3c4;padding:8px 12px;box-shadow:0 0 0 3px var(--ink);margin-bottom:14px}
.ol-plist-head{display:flex;align-items:baseline;gap:6px;margin:10px 0 8px;font-size:18px}

.ol-p.me{background:var(--yellow)}
.ol-kick{border:0;background:none;color:var(--bad);font-size:14px;padding:0 2px}
.ol-empty{color:#999;padding:10px}

.ol-tracks-wrap{margin-top:22px}
.ol-tracks{display:flex;flex-direction:column;gap:10px}
.ot-row{display:grid;grid-template-columns:30px 32px minmax(60px,140px) 1fr 70px;align-items:center;gap:8px;padding:4px 6px}

.ol-tracks.big .ot-row{grid-template-columns:40px 40px minmax(80px,180px) 1fr 90px;font-size:20px}
.ol-tracks.big .ot-bar{height:26px}
.ol-rtitle{font-size:34px;justify-content:center;display:flex;margin:6px 0;color:var(--ink);--pxs:#ffd84a}
.ol-result .panel{text-align:center}
.ol-myrank{font-size:22px;margin-bottom:10px}

.pod{display:flex;flex-direction:column;align-items:center;gap:2px}
.pod-name{font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:720px){

  .ol-qr img{width:160px;height:160px}
}

# 해와 달이 된 오누이

# 금도끼 은도끼

가을에 박을 타자 쌀과 보물이 쏟아져 나왔다.

놀부의 박에서는 도깨비와 흙탕물이 쏟아져 나왔다.
착하게 사는 마음이 가장 큰 보물이라는 이야기이다.

# 세종대왕과 한글
조선의 네 번째 임금 세종대왕은 백성을 무척 아꼈다.
그 시절 백성들은 어려운 한자를 배우기 힘들었다.
세종대왕은 누구나 쉽게 배울 수 있는 글자를 만들기로 했다.
그렇게 만든 글자가 바로 훈민정음, 오늘날의 한글이다.
훈민정음은 백성을 가르치는 바른 소리라는 뜻이다.
한글은 소리를 내는 입과 혀의 모양을 본떠 만들었다.
그래서 적은 수의 글자로 아주 많은 소리를 적을 수 있다.
우리가 지금 치고 있는 이 글자도 바로 그 선물이다.

# 물의 여행
바다의 물은 햇볕을 받으면 수증기가 되어 하늘로 올라간다.
하늘 높이 올라간 수증기는 차가워지며 작은 물방울이 된다.
물방울이 모이고 모여 구름이 만들어진다.
구름이 무거워지면 비나 눈이 되어 땅으로 내려온다.
땅에 내린 물은 강을 따라 흐르거나 땅속으로 스며든다.
그리고 다시 먼 길을 돌아 바다로 돌아간다.
이렇게 물은 쉬지 않고 지구를 빙글빙글 여행한다.
오늘 마신 물 한 잔도 아주 긴 여행을 하고 온 것이다.

# 바른 인터넷 생활
인터넷은 세상의 정보를 빠르게 찾을 수 있는 큰 도서관이다.
하지만 그 안에는 사실이 아닌 정보도 섞여 있다.
그래서 한 곳만 믿지 말고 여러 곳에서 확인해야 한다.
내 이름과 주소, 전화번호는 소중한 개인 정보이다.
모르는 사람에게 개인 정보를 알려 주면 위험할 수 있다.
화면 너머에도 마음을 가진 사람이 있다는 것을 기억하자.
댓글 하나에도 따뜻한 마음을 담으면 인터넷이 밝아진다.
바른 디지털 시민은 스스로 생각하고 서로를 존중한다.

# 로봇 친구 삐삐
우리 반에는 삐삐라는 작은 로봇이 있다.
삐삐는 아침마다 출석을 부르고 날씨를 알려 준다.
어느 날 삐삐가 이상한 소리를 내며 멈춰 버렸다.
우리는 모둠을 나누어 삐삐의 프로그램을 살펴보았다.
반복문 안에 들어간 작은 실수 하나가 원인이었다.
오류를 고치고 실행 버튼을 누르자 삐삐가 다시 웃었다.
그날 우리는 디버깅이 끈기의 다른 이름이라는 걸 배웠다.
삐삐는 오늘도 교실 한쪽에서 우리를 응원하고 있다.

# 사계절 이야기
봄에는 얼었던 땅이 녹고 새싹이 고개를 내민다.
학교 가는 길에 벚꽃이 비처럼 흩날린다.
여름에는 뜨거운 햇볕 아래 매미가 노래한다.
시원한 수박 한 조각이면 더위도 금방 잊는다.
가을에는 나뭇잎이 빨갛고 노랗게 물든다.
높고 푸른 하늘 아래에서 운동회가 열린다.
겨울에는 하얀 눈이 온 세상을 덮는다.
사계절이 있어서 우리의 일 년은 더 다채롭다.

# 우리 몸의 신기한 비밀
우리 몸에는 이백 개가 넘는 뼈가 있다.
뼈는 몸을 지탱하고 소중한 기관을 보호한다.
심장은 쉬지 않고 뛰며 온몸에 피를 보낸다.
폐는 숨을 쉴 때마다 산소를 받아들인다.
뇌는 우리가 생각하고 기억하고 느끼게 해 준다.
손가락 끝에는 아주 예민한 감각이 모여 있다.
그래서 우리는 눈을 감고도 자판을 느낄 수 있다.
몸을 아끼는 것은 나를 아끼는 첫걸음이다.

# 꿈을 향한 한 걸음
누구에게나 마음속에 품은 꿈이 하나쯤은 있다.
어떤 꿈은 크고 멀어서 닿지 않을 것처럼 보인다.
하지만 큰 꿈도 아주 작은 걸음에서 시작된다.
오늘 읽은 책 한 쪽, 오늘 푼 문제 하나가 그 걸음이다.
가끔은 넘어지고 길을 잃을 때도 있을 것이다.
그럴 때는 잠시 쉬었다가 다시 일어서면 된다.
꿈은 정해진 답이 아니라 계속 그려 가는 그림이다.
지금 이 순간에도 너의 그림은 조금씩 완성되고 있다.

# 별주부전

자라는 토끼에게 용궁에 가면 벼슬을 준다고 꾀었다.
토끼는 자라의 등에 올라타 깊은 바다로 내려갔다.
용궁에 도착하자 토끼는 자기 간을 내놓으라는 말을 들었다.
꾀 많은 토끼는 간을 숲속 바위에 두고 왔다고 둘러댔다.
다시 육지로 돌아온 토끼는 깡충깡충 숲으로 달아났다.
위기의 순간에도 침착하게 생각하면 길이 보인다.

function parseWords(obj) { const cats = {}; for (const [k, v] of Object.entries(obj)) cats[k] = [...new Set(v.split(/\s+/).filter(Boolean))]; return cats; }
function parseSent(obj) { const cats = {}; for (const [k, v] of Object.entries(obj)) cats[k] = v.split('\n').map(s => s.trim()).filter(Boolean); return cats; }
function parseLong(txt) {
  return txt.split(/\n#\s+/).map(b => b.trim()).filter(Boolean).map(b => { const ls = b.replace(/^#\s+/, '').split('\n').map(s => s.trim()).filter(Boolean); return { title: ls[0], lines: ls.slice(1) }; });
}
const DATA = {};
[['ko', KO_WORDS, KO_SENT, KO_LONG], ['en', EN_WORDS, EN_SENT, EN_LONG]].forEach(([l, w, s, lg]) => {
  const wc = parseWords(w), sc = parseSent(s);
  DATA[l] = { wordCats: wc, sentCats: sc, words: [...new Set(Object.values(wc).flat())], sentences: Object.values(sc).flat(), long: parseLong(lg) };
});

const KEY_STAGES = {
  ko: [['기본 자리', 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ'], ['윗줄', 'ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ'], ['아랫줄', 'ㅋㅌㅊㅍㅠㅜㅡ'], ['쌍자음 (Shift)', 'ㅃㅉㄸㄲㅆㅒㅖ'], ['숫자', '1234567890'], ['전체 복습', 'ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡㄲㅆ']],
  en: [['기본 자리', 'asdfghjkl;'], ['윗줄', 'qwertyuiop'], ['아랫줄', 'zxcvbnm,./'], ['대문자 (Shift)', 'ASDFGHJKLQWERTYUIOPZXCVBNM'], ['숫자·기호', '1234567890!?'], ['전체 복습', 'abcdefghijklmnopqrstuvwxyz,.']]
};
MODES.keys = {
  stage: 0, total: 40,
  mount(root) {
    const L = state.lang, stages = KEY_STAGES[L];
    if (this.stage >= stages.length) this.stage = 0;
    root.innerHTML = `<div class="mode">${modeHead('🎯', '자리 연습')}
      <div class="chips">${stages.map((s, i) => `<button class="chip ${i === this.stage ? 'on' : ''}" data-st="${i}">${i + 1}. ${s[0]}</button>`).join('')}</div>
      <div class="panel key-panel">
        <div class="key-queue"></div>
        <div class="finger-tip"></div>
        <div class="stat-row">${statBox('진행', 's-prog')}${statBox('정확도', 's-acc', '100%')}${statBox('타수', 's-cpm')}${statBox('오타', 's-err')}</div>
        <div class="bar"><i class="s-bar"></i></div>
      </div>
      <div class="kb-host"></div>
      <p class="hint">💡 자판의 <b>색깔</b>이 그 키를 누르는 손가락이에요. 돌기가 있는 ${L === 'ko' ? '<b>ㄹ</b>, <b>ㅓ</b>' : '<b>F</b>, <b>J</b>'}에 검지를 올려 두고 시작해요.</p>
    </div>`;
    bindHead(root); this.root = root;
    $$('[data-st]', root).forEach(b => b.onclick = () => { this.stage = +b.dataset.st; $$('.chip', root).forEach(c => c.classList.toggle('on', c === b)); this.start(); });
    this.kb = new Keyboard(L, (code, shift) => this.press(code, shift, null));
    $('.kb-host', root).appendChild(this.kb.el);
    this.start();
  },
  start() {
    const chars = [...KEY_STAGES[state.lang][this.stage][1]];
    const q = [];
    while (q.length < this.total) { const c = pick(chars); if (c !== q[q.length - 1] || chars.length < 2) q.push(c); }
    Object.assign(this, { q, i: 0, ok: 0, err: 0, t0: 0, done: false });
    this.render();
  },
  render() {
    const r = this.root;
    const win = this.q.slice(this.i, this.i + (r.clientWidth < 520 ? 5 : 9));
    const prev = this.q.slice(Math.max(0, this.i - 2), this.i);
    $('.key-queue', r).innerHTML = prev.map(c => `<span class="kq done">${esc(c)}</span>`).join('') +
      win.map((c, j) => `<span class="kq ${j === 0 ? 'cur' : ''}">${esc(c)}</span>`).join('');
    const info = this.kb.highlight(this.q[this.i]);
    $('.finger-tip', r).innerHTML = info ? `<i class="fdot f${info.finger}"></i><span><b>${FINGER_NAMES[info.finger]}</b>로 눌러요</span>${info.shift ? ` <span class="shift-tag">+ ${info.finger <= 3 ? '오른쪽' : '왼쪽'} Shift</span>` : ''}` : '';
    const min = this.t0 ? (now() - this.t0) / 60000 : 0;
    $('.s-prog', r).textContent = `${this.i}/${this.q.length}`;
    $('.s-acc', r).textContent = (this.ok + this.err ? Math.round(this.ok / (this.ok + this.err) * 100) : 100) + '%';
    $('.s-cpm', r).textContent = min > 0.02 ? Math.round(this.ok / min) : 0;
    $('.s-err', r).textContent = this.err;
    $('.s-bar', r).style.width = (this.i / this.q.length * 100) + '%';
  },
  onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || !e.code || this.done) return;
    const ae = document.activeElement; if (ae && ae.tagName === 'BUTTON') ae.blur();
    if (/^(Shift|Control|Alt|Meta|CapsLock|Tab|Escape|Backspace|Enter|Lang|Hangul|F\d)/.test(e.code) || e.repeat) return;
    let ch = null;
    if (state.lang === 'en' && e.key && e.key.length === 1 && e.key.charCodeAt(0) < 128) ch = e.key;
    else ch = pressedChar(e.code, e.shiftKey, state.lang);
    if (ch == null) return;
    e.preventDefault();
    this.press(e.code, e.shiftKey, ch);
  },
  press(code, shift, ch) {
    if (this.done) return;
    if (ch == null) ch = pressedChar(code, shift, state.lang);
    if (ch == null) return;
    if (!this.t0) this.t0 = now();
    if (ch === this.q[this.i]) {
      this.ok++; this.i++; this.kb.flash(code, true); Sound.key();
      if (this.i >= this.q.length) return this.finish();
    } else {
      this.err++; this.kb.flash(code, false); Sound.bad(); shake($('.kq.cur', this.root));
    }
    this.render();
  },
  finish() {
    this.done = true; this.render(); this.kb.clear();
    const min = (now() - this.t0) / 60000, cpm = Math.round(this.ok / Math.max(min, 0.01));
    const acc = Math.round(this.ok / (this.ok + this.err) * 100);
    const stages = KEY_STAGES[state.lang];
    Sound.win();
    showResult({
      title: `${stages[this.stage][0]} 완료!`, big: acc, bigUnit: '%', icon: acc >= 95 ? '🌟' : acc >= 80 ? '👍' : '💪',
      rows: [['정확도', acc + '%'], ['타수', cpm + '타/분'], ['오타', this.err + '번'], ['걸린 시간', (min * 60).toFixed(1) + '초']],
      onRetry: () => {
        if (acc >= 90 && this.stage < stages.length - 1) { this.stage++; toast(`🎉 다음 단계: <b>${stages[this.stage][0]}</b>`); }
        $$('.chip', this.root).forEach((c, i) => c.classList.toggle('on', i === this.stage));
        this.start();
      }
    });
  },
  unmount() { this.done = true; }
};

// ===== 게임 공통 =====
function showOverlay(ov, html) {
  ov.innerHTML = `<div class="ov-card">${html}</div>`; ov.classList.add('show');
  $$('.ov-icon', ov).forEach(el => { const t = el.textContent.trim(); if (t && !el.querySelector('img')) el.innerHTML = pxi(t, 64, 18); });
  $$('h3', ov).forEach(el => el.classList.add('pxt')); pxAll(ov);
  fitOverlay(ov);
}
// 설명창이 게임 창보다 크면, 설명창이 떠 있는 동안만 게임 창을 늘려요
function fitOverlay(ov) {
  const f = ov.parentElement, c = ov.querySelector('.ov-card'); if (!f || !c) return;
  f.style.minHeight = '';
  const need = c.offsetHeight + 28;
  if (need > f.clientHeight) f.style.minHeight = need + 'px';
}
function hideOverlay(ov) { ov.classList.remove('show'); if (ov.parentElement) ov.parentElement.style.minHeight = ''; }
function countdown(ov, done) {
  let n = 3; const seq = () => {
    if (n > 0) { ov.innerHTML = `<div class="count">${n}</div>`; ov.classList.add('show'); Sound.tick(); n--; setTimeout(seq, 650); }
    else { ov.innerHTML = `<div class="count go">시작!</div>`; Sound.ok(); setTimeout(() => { hideOverlay(ov); done(); }, 450); }
  };
  seq();
}
function floatText(host, x, y, text, cls = '') {
  const f = h(`<div class="float ${cls}" style="left:${x}px;top:${y}px">${text}</div>`);
  host.appendChild(f); setTimeout(() => f.remove(), 900);
}
function gameLoop(mode) {
  mode.last = now();
  const step = (t) => {
    if (!mode.running) return;
    const dt = Math.min(0.05, Math.max(0, (t - mode.last) / 1000)); mode.last = t;
    if (!mode.paused) mode.update(dt);
    mode.raf = requestAnimationFrame(step);
  };
  cancelAnimationFrame(mode.raf);
  mode.raf = requestAnimationFrame(step);
}
function pauseOnHide(mode) {
  mode._vis = () => { if (document.hidden && mode.running && !mode.paused && mode.togglePause) mode.togglePause(); };
  document.addEventListener('visibilitychange', mode._vis);
}
function stopGame(mode) {
  mode.running = false; cancelAnimationFrame(mode.raf);
  if (mode._vis) document.removeEventListener('visibilitychange', mode._vis);
}
const PC_GAMES = ['mole', 'race', 'bomb'];
function pcHint(id) {
  return PC_GAMES.includes(id) && (innerWidth <= 480 || innerHeight <= 680)
    ? '<div class="ov-pc">💻 화면이 작은 휴대폰에서는 입력창이 아래에 있어요.<br>PC나 태블릿에서 하면 더 편해요!</div>' : '';
}
function startBtnHtml(icon, title, rules, bestKey, unit) {
  const b = getBest(bestKey);
  return `<div class="ov-icon">${icon}</div><h3>${title}</h3><ul class="rules">${rules.map(r => `<li>${r}</li>`).join('')}</ul>
    ${b ? `<div class="ov-best">🏆 내 최고 기록 <b>${b.toLocaleString()}${unit}</b></div>` : ''}
    ${pcHint(bestKey)}
    <button class="btn primary big" data-start>시작하기 ▶</button><div class="ov-small">입력창에서 엔터를 눌러도 시작해요</div>`;
}

  spawn() {
    const pool = DATA[state.lang].words;

    const r = Math.random();

    if (r < 0.06) type = 'gold'; else if (r < 0.09) type = 'ice'; else if (r < 0.115) type = 'bomb'; else if (r < 0.14 && this.hearts < 5) type = 'heal';
    const icon = { gold: '⭐', ice: '❄️', bomb: '💣', heal: '💖' }[type] || '';

    const free = [...Array(lanes).keys()].filter(i => !busy.has(i));
    const lane = free.length ? pick(free) : pick([...Array(lanes).keys()]);
    const slot = (W - 16) / lanes;
    const x = clamp(8 + lane * slot + (slot - ew) / 2 + (Math.random() - 0.5) * 20, 6, W - ew - 6);
    const d = { word: w, type, el, lane, x, y: -40, hgt: el.offsetHeight, v: (this.H - this.groundH) / this.fallTime() * (0.85 + Math.random() * 0.3) };

    this.holes.forEach(o => this.hide(o, true));

    hideOverlay(this.ov); this.ti.reset(); this.ti.focus();
    this.running = true; this.hud(); gameLoop(this);
  },
  update(dt) {
    this.t -= dt;
    if (this.t <= 0) { this.t = 0; this.hud(); return this.end(); }
    const p = 1 - this.t / this.DUR;
    this.spawnT -= dt;
    const upCount = this.holes.filter(o => o.up).length;
    const maxUp = p < 0.35 ? 2 : p < 0.7 ? 3 : 4;
    if (this.spawnT <= 0 && upCount < maxUp) { this.spawn(p); this.spawnT = 1.5 - p * 0.75; }
    for (const o of this.holes) if (o.up && !o.busy) { o.life -= dt; if (o.life <= 0) { this.misses++; this.combo = 0; this.hide(o); } }
    this.hud();
  },
  spawn(p) {
    const free = this.holes.filter(o => !o.up && !o.busy); if (!free.length) return;
    const o = pick(free);
    const used = new Set(this.holes.filter(x => x.up).map(x => x.word));
    let w, n = 0; do { w = pick(DATA[state.lang].words); } while (used.has(w) && n++ < 30);
    o.word = w; o.gold = Math.random() < 0.1; o.life = 6 - p * 2.4; o.up = true;
    $('.sign', o.el).textContent = (o.gold ? '👑 ' : '') + w;

  },
  fire(v) {
    if (!this.running) { if (this.ov.classList.contains('show') && $('[data-start]', this.ov)) this.start(); return; }
    this.ti.reset(); if (!v) return;
    const o = this.holes.find(x => x.up && !x.busy && x.word === v);
    if (!o) { this.combo = 0; Sound.bad(); shake($('.game-form', this.root)); return; }
    o.busy = true; o.el.classList.add('hit');
    this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo); this.hits++;
    this.typedKeys += keyCount(v);
    const pts = keyCount(v) * 10 * (o.gold ? 2 : 1) + (this.combo >= 3 ? this.combo * 5 : 0);
    this.score += pts;
    const r = o.el.getBoundingClientRect(), fr = this.field.getBoundingClientRect();
    floatText(this.field, r.left - fr.left + r.width / 2 - 20, r.top - fr.top + 4, '+' + pts + (this.combo >= 3 ? ` 🔥${this.combo}` : ''), o.gold ? 'gold' : '');
    Sound.pop();
    setTimeout(() => { o.busy = false; this.hide(o); }, 380);
    this.hud();
  },
  hud() {
    const r = this.root;
    $('.g-score', r).textContent = (this.score || 0).toLocaleString();
    $('.g-hits', r).textContent = this.hits || 0;
    const t = this.t ?? this.DUR;

    $('.time-wrap', r).classList.toggle('danger', t <= 10);
  },
  end() {
    stopGame(this); pauseOnHide(this);
    this.holes.forEach(o => this.hide(o, true));
    Sound.win();
    const b = saveBest('mole', this.score);
    const tot = this.hits + this.misses;
    showResult({
      title: '시간 끝!', icon: '🐹', big: this.score.toLocaleString(), bigUnit: '점', newBest: b.isNew && this.score === b.best,
      rows: [['잡은 두더지', this.hits + '마리'], ['놓친 두더지', this.misses + '마리'], ['명중률', (tot ? Math.round(this.hits / tot * 100) : 0) + '%'], ['최대 콤보', this.maxCombo + '콤보'], ['내 최고 점수', b.best.toLocaleString() + '점']],
      onRetry: () => this.start()
    });
  },
  togglePause() {
    if (!this.running) return;
    this.paused = !this.paused;
    if (this.paused) { showOverlay(this.ov, `<div class="ov-icon">⏸</div><h3>잠깐 쉬는 중</h3><button class="btn primary big" data-resume>계속하기 ▶</button>`); $('[data-resume]', this.ov).onclick = () => this.togglePause(); }
    else { hideOverlay(this.ov); this.last = now(); this.ti.focus(); }

const RACERS = [{ e: '🐢', n: '거북이' }, { e: '🐇', n: '토끼' }, { e: '🐆', n: '치타' }];

  ready() {

    const f = state.lang === 'en' ? 0.8 : 1;

      ${getBest('race') ? `<div class="ov-best">🏆 내 최고 <b>${getBest('race')}타</b></div>` : ''}
      ${pcHint('race')}
      <button class="btn primary big" data-start>출발 준비 ▶</button>`);
    $('[data-start]', this.ov).onclick = () => this.go();
    this.updStats();
  },
  go() {
    countdown(this.ov, () => {
      this.input.disabled = false; this.input.placeholder = '위 문장을 똑같이 치고 엔터!';
      this.ti.reset(); this.ti.focus();
      this.t0 = now(); this.running = true; this.paused = false; gameLoop(this);
    });
  },
  setPos(k, p) {
    const el = $(`.runner[data-r="${k}"]`, this.root); if (el) el.style.setProperty('--p', clamp(p, 0, 1));
  },
  update() {
    this.el = (now() - this.t0) / 1000;
    this.speeds.forEach((s, i) => {
      const wob = 1 + Math.sin(this.el * (1.3 + i * 0.4) + i) * 0.06;
      const p = (s / 60) * this.el * wob / this.totalKeys;
      if (p >= 1 && !this.cpuDone[i]) this.cpuDone[i] = this.el;
      this.setPos(i, this.cpuDone[i] ? 1 : p);
    });
    this.setPos('me', (this.doneKeys + this.liveKeys) / this.totalKeys);
    this.updStats();
  },
  updStats() {
    const r = this.root; if (!r) return;
    const keys = this.doneKeys + this.liveKeys;
    $('.s-cpm', r).textContent = this.el > 1 ? Math.round(keys / this.el * 60) : 0;
    $('.s-prog', r).textContent = Math.round(keys / this.totalKeys * 100) + '%';
    $('.s-line', r).textContent = `${Math.min(this.li + (this.finished ? 0 : 1), 3)}/3`;
    $('.s-time', r).textContent = (this.el || 0).toFixed(1) + '초';
  },
  onInput(v) {
    if (!this.running) return;
    const line = this.lines[this.li]; const c = compare(line, v);
    renderTarget($('.race-line', this.root), line, c);
    let k = 0;
    for (let i = 0; i < c.st.length; i++) { if (c.st[i] === 'ok') k += keyCount(line[i]); else { if (c.st[i] === 'pending') k += keyCount(v[i]); break; } }
    this.liveKeys = k;
  },
  onSubmit(v) {
    if (!this.running || !v) return;
    const line = this.lines[this.li];
    if (v !== line) {
      Sound.bad(); shake($('.race-panel', this.root));
      toast('🔧 빨간 글자를 고쳐야 다음 문장으로 가요!', 1500); return;
    }
    Sound.ok();
    this.doneKeys += keyCount(line); this.liveKeys = 0; this.li++; this.ti.reset();
    if (this.li >= this.lines.length) return this.finish();
    renderTarget($('.race-line', this.root), this.lines[this.li], null);
    const nx = this.lines[this.li + 1];
    $('.race-next', this.root).innerHTML = nx ? `<span class="tag">다음</span> ${esc(nx)}` : '<span class="tag">마지막 문장!</span>';
  },
  finish() {
    this.finished = true;
    this.el = (now() - this.t0) / 1000; this.setPos('me', 1); this.updStats();
    stopGame(this); pauseOnHide(this);
    this.input.disabled = true;
    const cpuTimes = this.speeds.map(s => this.totalKeys / (s / 60));
    const rank = 1 + cpuTimes.filter(t => t < this.el).length;
    this.speeds.forEach((s, i) => this.setPos(i, Math.min(1, this.el / cpuTimes[i])));
    const cpm = Math.round(this.totalKeys / this.el * 60);
    const b = saveBest('race', cpm);
    rank === 1 ? Sound.win() : Sound.level();
    const medal = ['🥇', '🥈', '🥉', '🏅'][rank - 1];
    showResult({
      title: rank === 1 ? '우승! 1등으로 골인!' : `${rank}등으로 골인!`, icon: medal, big: cpm, bigUnit: '타/분', newBest: b.isNew && cpm === b.best,
      gradeInfo: null,
      rows: [['순위', `${rank}등 / 4명`], ['기록', this.el.toFixed(1) + '초'], ['난이도', RACE_DIFF[this.diff].name], ['내 최고 타수', b.best + '타']],
      onRetry: () => this.ready()
    });
  },
  togglePause() {
    // 레이스는 멈추지 않음 (탭을 떠나면 기록이 나빠질 수 있어요)
  },

    this.t -= dt;
    const s = Math.ceil(this.t);
    if (this.t <= 5 && s < this.lastTick) { this.lastTick = s; Sound.tick(); }
    if (this.t > 5) this.lastTick = 99;
    if (this.t <= 0) { this.t = 0; this.hud(); return this.explode(); }
    this.hud();
  },
  hud() {
    const r = this.root;
    $('.b-time', r).textContent = Math.max(0, this.t).toFixed(1);
    $('.g-tbar', r).style.width = clamp(this.t / this.MAXT * 100, 0, 100) + '%';
    $('.g-n', r).textContent = this.n;
    $('.g-cpm', r).textContent = this.ms > 0 ? Math.round(this.keys / this.ms * 60000) : 0;
    this.field.classList.toggle('danger', this.running && this.t <= 5);
  },
  onInput(v) { if (this.running && this.cur) renderTarget($('.bomb-line', this.root), this.cur, compare(this.cur, v)); },
  onSubmit(v, ms) {
    if (!this.running) { if (this.ov.classList.contains('show') && $('[data-start]', this.ov)) this.start(); return; }
    if (this.paused || !v) return;
    if (v !== this.cur) { Sound.bad(); shake($('.bomb-panel', this.root)); toast('🔧 틀린 글자를 고쳐서 다시 엔터!', 1300); return; }
    const k = keyCount(this.cur);
    const base = state.lang === 'en' ? 90 : 110, step = state.lang === 'en' ? 7 : 8;
    const bonus = k * 60 / (base + this.n * step);
    this.t = Math.min(this.MAXT, this.t + bonus);
    this.keys += k; this.ms += Math.max(ms, 400); this.n++;
    floatText(this.field, this.field.clientWidth / 2 + 70, 70, `+${bonus.toFixed(1)}초`, 'gold');
    Sound.ok(); this.ti.reset(); this.next(); this.hud();
  },
  explode() {
    stopGame(this); pauseOnHide(this);
    this.field.classList.remove('danger'); this.field.classList.add('boom');
    Sound.boom();
    const b = saveBest('bomb', this.n);
    const cpm = this.ms > 0 ? Math.round(this.keys / this.ms * 60000) : 0;
    setTimeout(() => showResult({
      title: '펑! 폭탄이 터졌어요', icon: '💥', big: this.n, bigUnit: '개 해체', newBest: b.isNew && this.n === b.best,
      rows: [['평균 타수', cpm + '타'], ['내 최고 기록', b.best + '개']],
      onRetry: () => this.start()
    }), 900);
  },
  togglePause() {
    if (!this.running) return;
    this.paused = !this.paused;
    if (this.paused) { showOverlay(this.ov, `<div class="ov-icon">⏸</div><h3>잠깐 쉬는 중</h3><p class="ov-small">글자는 가려져요 😉</p><button class="btn primary big" data-resume>계속하기 ▶</button>`); $('[data-resume]', this.ov).onclick = () => this.togglePause(); $('.bomb-panel', this.root).classList.add('blur'); }
    else { hideOverlay(this.ov); $('.bomb-panel', this.root).classList.remove('blur'); this.last = now(); this.ti.focus(); }
  },
  unmount() { stopGame(this); }
};

// ===== 시작 =====
function setLang(l) {
  if (currentId.startsWith('online') && OL.room) { toast('온라인 방에서는 방장이 정한 언어로 해요'); return; }
  state.lang = l; store.set('lang', l);
  $$('.lang-toggle button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  document.documentElement.lang = l;
  go(currentId);
}
function boot() {
  $$('.lang-toggle button').forEach(b => b.onclick = () => { if (state.lang !== b.dataset.lang) setLang(b.dataset.lang); });
  $$('.lang-toggle button').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  const sb = $('#soundBtn');
  const paintSound = () => { sb.textContent = Sound.on ? '🔊' : '🔇'; sb.setAttribute('aria-label', Sound.on ? '소리 끄기' : '소리 켜기'); };
  sb.onclick = () => { Sound.on = !Sound.on; store.set('sound', Sound.on); paintSound(); Sound.init(); Sound.ok(); };
  paintSound();
  $('#homeBtn').onclick = () => go('home');
  $('#lgKey').innerHTML = pxi('⌨️', 34, 14); pxAll($('.topbar'));
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sound.init(), { capture: true }));
  document.addEventListener('keydown', (e) => {
    if ($('#modal').classList.contains('show')) return;
    if (e.key === 'Escape' && current && current.togglePause && current.running) { e.preventDefault(); current.togglePause(); return; }
    if (current && current.onKey) current.onKey(e);
  });
  const id = (location.hash || '').slice(1);
  go(MODES[id] ? id : 'home');
}

// ===== 새 게임 모음 =====
function pauseToggle(m, onPause, onResume) {
  if (!m.running) return;
  m.paused = !m.paused;
  if (m.paused) {
    showOverlay(m.ov, `<div class="ov-icon">⏸️</div><h3>잠깐 쉬는 중</h3><button class="btn primary big" data-resume>계속하기 ▶</button><div class="ov-small">Esc 키로도 멈추고 다시 시작할 수 있어요</div>`);
    $('[data-resume]', m.ov).onclick = () => pauseToggle(m, onPause, onResume);
    onPause && onPause();
  } else { hideOverlay(m.ov); m.last = now(); onResume && onResume(); m.ti && m.ti.focus(); }
}
function levelBanner(field, text) {
  const b = h(`<div class="level-banner pxt">${esc(text)}</div>`); field.appendChild(b); pxAll(field); setTimeout(() => b.remove(), 1200);
}
function pickWord(filter, avoid) {
  const pool = DATA[state.lang].words; let w, n = 0;
  do { w = pick(pool); } while (((filter && !filter(w)) || (avoid && avoid.has(w))) && n++ < 80);
  return w;
}
const len = (w) => [...w].length;

// ===== 움직이는 낱말 게임 엔진 (좀비·풍선·낚시) =====
function moverMode(cfg) {
  return {
    cfg,
    mount(root) {
      const c = this.cfg;
      root.innerHTML = `<div class="mode">${modeHead(c.icon, c.title)}
        <div class="game-hud">
          <div class="hud-item">점수 <b class="g-score">0</b></div>
          ${c.lives ? '<div class="hud-item g-hearts"></div>' : '<div class="hud-item time-wrap">⏱ <b class="g-time"></b><div class="tbar"><i class="g-tbar"></i></div></div>'}
          <div class="hud-item">단계 <b class="g-level">1</b></div>
          <div class="hud-item g-combo"></div>
          <button class="btn small ghost g-pause" title="일시정지">⏸</button>
        </div>
        <div class="field mover-field ${c.fieldClass}">${c.deco ? c.deco() : ''}<div class="movers"></div><div class="overlay"></div></div>
        <form class="type-form game-form"><input class="type-input" type="text" placeholder="${c.placeholder}"></form>
        <p class="hint legend">${c.legend.map(x => `<span>${x}</span>`).join('')}</p></div>`;
      bindHead(root); this.root = root;
      this.field = $('.mover-field', root); this.layer = $('.movers', root); this.ov = $('.overlay', root);
      this.ti = new TypeInput($('.type-input', root), { onSubmit: v => this.fire(v) });
      $('.g-pause', root).onclick = () => this.togglePause();
      pauseOnHide(this); this.running = false; this.items = [];
      Object.assign(this, { hearts: c.lives, t: c.duration, score: 0, level: 1, combo: 0 });
      showOverlay(this.ov, startBtnHtml(c.icon, c.startTitle, c.rules, c.id, '점'));
      $('[data-start]', this.ov).onclick = () => this.start();
      this.hud(); setTimeout(() => this.ti.focus(), 50);
    },
    start() {
      this.layer.innerHTML = ''; this.items = [];
      Object.assign(this, { score: 0, level: 1, hearts: this.cfg.lives, t: this.cfg.duration, cleared: 0, missed: 0, combo: 0, maxCombo: 0, spawnT: 0.3, paused: false, T: 0 });
      hideOverlay(this.ov); this.ti.reset(); this.ti.focus();
      this.W = this.field.clientWidth; this.H = this.field.clientHeight;
      this.running = true; this.hud(); gameLoop(this);
    },
    get prog() { return this.cfg.duration ? 1 - this.t / this.cfg.duration : Math.min(1, (this.level - 1) / 10); },
    update(dt) {
      const c = this.cfg; this.T += dt;
      if (c.duration) { this.t -= dt; if (this.t <= 0) { this.t = 0; this.hud(); return this.end(); } }
      this.spawnT -= dt;
      if (this.spawnT <= 0 && this.items.length < c.maxOn(this)) { this.spawn(); this.spawnT = c.every(this); }
      for (const d of [...this.items]) {
        d.t += dt; c.move(this, d, dt);
        d.el.style.transform = `translate(${d.x}px,${d.y}px)`;
        if (c.gone(this, d)) this.escape(d);
      }
      if (c.duration) this.hud();
    },
    spawn() {
      const c = this.cfg, used = new Set(this.items.map(d => d.word));
      const w = pickWord(c.maxLen ? (x => len(x) <= c.maxLen) : null, used);
      const kind = c.kind(this);
      const el = h(c.html(w, kind)); this.layer.appendChild(el);
      const d = { word: w, kind, el, w: el.offsetWidth, hgt: el.offsetHeight, x: 0, y: 0, t: 0, ph: Math.random() * 6 };
      c.place(this, d); el.style.transform = `translate(${d.x}px,${d.y}px)`;
      this.items.push(d);
    },
    remove(d, cls) { this.items = this.items.filter(x => x !== d); d.el.classList.add(cls); setTimeout(() => d.el.remove(), 500); },
    escape(d) {
      this.remove(d, 'escape');
      if (d.kind.bad) return;
      this.missed++; this.combo = 0;
      if (this.cfg.lives) {
        this.hearts--; Sound.bad(); shake(this.field);
        if (this.hearts <= 0) { this.hud(); return this.end(); }
      }
      this.hud();
    },
    fire(v) {
      if (!this.running) { if (this.ov.classList.contains('show') && $('[data-start]', this.ov)) this.start(); return; }
      if (this.paused) return;
      this.ti.reset(); if (!v) return;
      const hits = this.items.filter(d => d.word === v);
      if (!hits.length) { this.combo = 0; Sound.bad(); shake($('.game-form', this.root)); this.hud(); return; }
      const d = this.cfg.pickHit ? this.cfg.pickHit(this, hits) : hits[0];
      if (d.kind.bad) {
        this.remove(d, 'boom'); this.score = Math.max(0, this.score - 100); this.combo = 0;
        Sound.boom(); floatText(this.field, d.x, Math.max(10, d.y), '-100', 'bad'); shake(this.field);
        toast('💣 폭탄은 치면 안 돼요!', 1300);
        this.hud(); return;
      }
      this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo); this.cleared++;
      const pts = Math.round(keyCount(v) * 10 * (1 + (this.level - 1) * 0.2) * (d.kind.mult || 1)) + (this.combo >= 3 ? this.combo * 5 : 0);
      this.score += pts;
      floatText(this.field, d.x + 10, Math.max(8, d.y), '+' + pts, (d.kind.mult || 1) > 1 ? 'gold' : '');
      Sound.pop(); this.remove(d, this.cfg.hitCls || 'pop');
      if (this.cleared % 8 === 0 && this.level < 15) { this.level++; Sound.level(); levelBanner(this.field, `LEVEL ${this.level}!`); }
      this.hud();
    },
    hud() {
      const r = this.root, c = this.cfg;
      $('.g-score', r).textContent = (this.score || 0).toLocaleString();
      $('.g-level', r).textContent = this.level || 1;
      if (c.lives) $('.g-hearts', r).innerHTML = Array.from({ length: c.lives }, (_, i) => `<span class="${i < this.hearts ? '' : 'lost'}">${pxi('❤️', 20, 12)}</span>`).join('');
      else { const t = this.t ?? c.duration; $('.g-time', r).textContent = Math.ceil(t); $('.g-tbar', r).style.width = (t / c.duration * 100) + '%'; $('.time-wrap', r).classList.toggle('danger', t <= 10); }
      $('.g-combo', r).innerHTML = this.combo >= 3 ? `<span class="combo">🔥 ${this.combo} 콤보</span>` : '';
    },
    togglePause() { pauseToggle(this); },
    end() {
      stopGame(this); pauseOnHide(this);
      this.items.forEach(d => d.el.classList.add('escape'));
      this.cfg.lives ? Sound.over() : Sound.win();
      const b = saveBest(this.cfg.id, this.score);
      setTimeout(() => showResult({
        title: this.cfg.lives ? '게임 끝!' : '시간 끝!', icon: this.cfg.icon, big: this.score.toLocaleString(), bigUnit: '점', newBest: b.isNew && this.score === b.best,
        rows: [[this.cfg.caughtLabel || '잡은 낱말', this.cleared + '개'], ['놓친 낱말', this.missed + '개'], ['도달 단계', this.level + '단계'], ['최대 콤보', this.maxCombo + '콤보'], ['내 최고 점수', b.best.toLocaleString() + '점']],
        onRetry: () => this.start()
      }), 500);
    },
    unmount() { stopGame(this); }
  };
}

// ===== 온라인 대결 (Firebase Realtime Database) =====
const FB_VER = '10.12.2';
const AVATARS = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐤', '🦄', '🐙', '🦖', '🐳', '🦉', '🐢', '🦋', '🐞'];
const ONLINE_ON = typeof BUILD_WEB !== 'undefined' && BUILD_WEB;

function parseCfg(text) {
  const c = {};
  for (const k of ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'storageBucket', 'messagingSenderId', 'appId']) {
    const m = String(text).match(new RegExp(k + '["\']?\\s*:\\s*["\']([^"\']+)["\']'));
    if (m) c[k] = m[1].trim();
  }
  return c;
}
function fbConfig() {
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('mock')) return { mock: true };
    const fb = q.get('fb');
    if (fb) { const c = JSON.parse(atob(fb)); if (c.apiKey && c.databaseURL) { store.set('fbcfg', c); return c; } }
  } catch (e) { }
  if (typeof FB_CONFIG_FILE !== 'undefined' && FB_CONFIG_FILE && FB_CONFIG_FILE.apiKey && FB_CONFIG_FILE.databaseURL) return FB_CONFIG_FILE;
  const s = store.get('fbcfg', null);
  return s && s.apiKey && s.databaseURL ? s : null;
}
const cfgFromFile = () => typeof FB_CONFIG_FILE !== 'undefined' && FB_CONFIG_FILE && FB_CONFIG_FILE.apiKey;

// ----- 통신 계층 (Firebase / 테스트용 가짜 서버) -----
const Net = {
  ok: false, offset: 0, mock: false,
  async init() {
    if (this.ok) return true;
    const cfg = fbConfig(); if (!cfg) return false;
    if (cfg.mock) { this._mockInit(); this.mock = true; this.ok = true; return true; }
    const A = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
    const D = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database.js`);
    const app = A.initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, databaseURL: cfg.databaseURL, projectId: cfg.projectId, appId: cfg.appId });
    this.D = D; this.db = D.getDatabase(app);
    D.onValue(D.ref(this.db, '.info/serverTimeOffset'), s => { this.offset = s.val() || 0; });
    this.ok = true; return true;
  },
  now() { return Date.now() + this.offset; },
  r(p) { return this.D.ref(this.db, p); },
  async get(p) { if (this.mock) return this._get(p); const s = await this.D.get(this.r(p)); return s.val(); },
  set(p, v) { if (this.mock) return this._write({ [p]: v }); return this.D.set(this.r(p), v); },
  update(p, obj) { if (this.mock) { const o = {}; for (const [k, v] of Object.entries(obj)) o[p + '/' + k] = v; return this._write(o); } return this.D.update(this.r(p), obj); },
  remove(p) { return this.set(p, null); },
  on(p, cb) { if (this.mock) return this._on(p, cb); return this.D.onValue(this.r(p), s => cb(s.val())); },
  onDisc(p) { if (this.mock) { this._disc.add(p); return; } this.D.onDisconnect(this.r(p)).remove(); },
  offDisc(p) { if (this.mock) { this._disc.delete(p); return; } this.D.onDisconnect(this.r(p)).cancel(); },
  // --- 가짜 서버 (같은 브라우저의 여러 창끼리, 테스트용 ?mock) ---
  _mockInit() {
    this._disc = new Set(); this._subs = [];
    try { this.bc = new BroadcastChannel('tajamock'); this.bc.onmessage = () => this._fire(); } catch (e) { }
    window.addEventListener('storage', e => { if (e.key === 'tajamock') this._fire(); });
    window.addEventListener('pagehide', () => { const o = {}; this._disc.forEach(p => o[p] = null); if (this._disc.size) this._write(o); });
  },
  _tree() { try { return JSON.parse(localStorage.getItem('tajamock') || '{}'); } catch (e) { return {}; } },
  _keys(p) { return p.split('/').filter(Boolean); },
  _get(p) { let n = this._tree(); for (const k of this._keys(p)) { if (n == null) return null; n = n[k]; } return n === undefined ? null : n; },
  _write(o) {
    const t = this._tree();
    for (const [p, v] of Object.entries(o)) {
      const ks = this._keys(p); let n = t;
      for (let i = 0; i < ks.length - 1; i++) { if (typeof n[ks[i]] !== 'object' || n[ks[i]] === null) n[ks[i]] = {}; n = n[ks[i]]; }
      const last = ks[ks.length - 1];
      if (v === null || v === undefined) delete n[last]; else n[last] = JSON.parse(JSON.stringify(v));
    }
    localStorage.setItem('tajamock', JSON.stringify(t));
    try { this.bc && this.bc.postMessage(1); } catch (e) { }
    setTimeout(() => this._fire(), 0);
    return Promise.resolve();
  },
  _on(p, cb) {
    const s = { p, cb, last: undefined };
    s.f = () => { const v = this._get(p), j = JSON.stringify(v); if (j !== s.last) { s.last = j; cb(v); } };
    this._subs.push(s); setTimeout(s.f, 0);
    return () => { this._subs = this._subs.filter(x => x !== s); };
  },
  _fire() { this._subs.forEach(s => s.f()); }
};

// ----- 순위 계산 -----
function olPlayers(room) { return Object.entries(room && room.players || {}).map(([id, p]) => ({ id, ...p })); }
function olRank(room) {
  const ps = olPlayers(room).filter(p => !p.late);
  if (room.game === 'battle') return ps.sort((a, b) => (b.score || 0) - (a.score || 0) || (b.cpm || 0) - (a.cpm || 0));
  return ps.sort((a, b) => (b.done ? 1 : 0) - (a.done ? 1 : 0) || (a.done && b.done ? a.t - b.t : (b.p || 0) - (a.p || 0)));
}
function olTracks(room, me, limit = 99) {
  const rk = olRank(room); if (!rk.length) return '<div class="ol-empty">아직 아무도 없어요</div>';
  const maxS = Math.max(1, ...rk.map(p => p.score || 0));
  let rows = rk.map((p, i) => ({ p, i }));
  if (rows.length > limit) { const mine = rows.find(r => r.p.id === me); rows = rows.slice(0, limit); if (mine && !rows.includes(mine)) rows.push(mine); }
  return rows.map(({ p, i }) => {
    const pct = room.game === 'battle' ? (p.score || 0) / maxS * 100 : (p.done ? 100 : (p.p || 0) * 100);
    const stat = room.game === 'battle' ? `${p.score || 0}개` : p.done ? `${(p.t / 1000).toFixed(1)}초` : `${p.cpm || 0}타`;
    return `<div class="ot-row ${p.id === me ? 'me' : ''} ${p.done ? 'done' : ''}"><span class="ot-rank">${i + 1}</span>${pxi(p.av || '🐶', 28, 14)}<span class="ot-name">${esc(p.name || '?')}</span><div class="ot-bar"><i style="width:${clamp(pct, 0, 100)}%"></i>${p.done ? '<em>🏁</em>' : ''}</div><span class="ot-stat">${stat}</span></div>`;
  }).join('');
}
